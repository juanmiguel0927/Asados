            { module: 'fritos', category: 'pasteles', name: 'Pastel Carne Aceitunas', time: '50m', diff: 'Media', prep: ['Preparar relleno de carne molida guisada.', 'Añadir al relleno huevo duro picado, aceitunas laminadas y alcaparras.', 'Armar el pastel grande y freír.'], ing: ['Masa maíz', 'Carne molida', 'Aceitunas', 'Alcaparras', 'Huevo duro'], secret: 'El sabor de la aceituna y alcaparra da el toque cartagenero auténtico.', tags: ['costeño'] },
            { module: 'fritos', category: 'pasteles', name: 'Pastel Pollo Pasas', time: '50m', diff: 'Media', prep: ['Hacer un guiso de pollo con un toque dulce (panela o azúcar).', 'Añadir uvas pasas al relleno al momento de armar.', 'Cerrar y freír.'], ing: ['Masa maíz', 'Pollo guisado', 'Uvas pasas'], secret: 'El contraste agridulce es típico de la costa Caribe.', tags: ['costeño'] },
            { module: 'fritos', category: 'pasteles', name: 'Pastel Carne Papa', time: '50m', diff: 'Media', prep: ['Picar papa en cubos muy pequeños y cocinar.', 'Mezclar con carne molida guisada (proporción 50/50).', 'Armar pasteles y freír.'], ing: ['Masa maíz', 'Carne molida', 'Papa común'], secret: 'La papa absorbe el jugo de la carne y rinde mucho el relleno.', tags: ['clásico'] },
            { module: 'fritos', category: 'pasteles', name: 'Pastel Huevo', time: '50m', diff: 'Media', prep: ['Sobre el relleno base (carne o pollo y arroz), colocar medio huevo duro o uno entero si es pequeño.', 'Cubrir con masa con cuidado de no romperla al estirar sobre el huevo.', 'Freír.'], ing: ['Masa maíz', 'Relleno carne/arroz', 'Huevo duro'], secret: 'Ubicar el huevo justo en el centro para que sea la sorpresa al morder.', tags: ['sorpresa'] },
            
            // Arepas
            { module: 'fritos', category: 'arepas', name: 'Arepa de Huevo Tradicional', time: '40m', diff: 'Difícil', prep: ['Amasar maíz peto (trillado) o harina precocida con agua y sal. Hacer arepas de unos 5mm de grosor.', 'Freír en abundante aceite a temperatura media hasta que se inflen y suban a la superficie (aprox 3 min). No dejar dorar mucho.', 'Sacar, escurrir rápido y con cuidado hacer una ranura lateral (boca) con un cuchillo fino.', 'Verter un huevo crudo dentro de la arepa (ayúdate vaciando el huevo en una taza pequeña primero).', 'Sellar la ranura con un poco de masa cruda reservada.', 'Volver a freír hasta que el huevo se cocine y la arepa dore.'], ing: ['Masa maíz peto', 'Huevos crudos', 'Aceite abundante', 'Sal'], secret: 'Al verter el huevo, mantén la arepa vertical y espera unos segundos que el huevo baje al fondo antes de intentar sellar.', tags: ['icono'] },
            { module: 'fritos', category: 'arepas', name: 'Arepa Carne Desmechada', time: '45m', diff: 'Difícil', prep: ['Seguir el proceso de la arepa de huevo.', 'Antes de verter el huevo, introducir carne desmechada (previamente cocinada y SECA) por la ranura, empujándola al fondo.', 'Luego verter el huevo, sellar y freír.'], ing: ['Masa maíz', 'Huevo', 'Carne desmechada'], secret: 'La carne debe estar seca (sin salsa) o ablandará la masa y se romperá en el aceite.', tags: ['completa'] },
            { module: 'fritos', category: 'arepas', name: 'Arepa Jamón y Queso', time: '40m', diff: 'Difícil', prep: ['Igual proceso de fritura inicial.', 'Introducir jamón picado y queso costeño rallado o en cubos antes del huevo.', 'Sellar y terminar fritura.'], ing: ['Masa maíz', 'Huevo', 'Jamón', 'Queso'], secret: 'Usa un queso que no suelte mucha agua (costeño o doble crema seco).', tags: ['mixta'] },
            { module: 'fritos', category: 'arepas', name: 'Arepa Salchicha', time: '40m', diff: 'Difícil', prep: ['Picar salchicha finamente.', 'En un vaso, poner el huevo crudo y la salchicha.', 'Batir ligeramente para mezclar y verter todo junto dentro de la arepa.', 'Sellar y freír.'], ing: ['Masa maíz', 'Huevo', 'Salchicha ranchera/viena'], secret: 'Batir ligeramente el huevo con la salchicha facilita el vertido y distribución.', tags: ['rápido'] },
            { module: 'fritos', category: 'arepas', name: 'Arepa Hogao', time: '40m', diff: 'Difícil', prep: ['Tener listo un hogao bien espeso y frío.', 'Introducir una cucharada generosa de hogao dentro de la arepa antes del huevo.', 'Sellar y freír.'], ing: ['Masa maíz', 'Huevo', 'Hogao espeso'], secret: 'El hogao debe ser una pasta, si tiene líquido dañará la arepa.', tags: ['criollo'] },
            { module: 'fritos', category: 'arepas', name: 'Arepa de Huevo Pollo', time: '45m', diff: 'Difícil', prep: ['Usar pollo desmechado seco.', 'Introducir el pollo en la arepa antes del huevo.', 'Verter huevo, sellar y freír.'], ing: ['Masa maíz', 'Huevo', 'Pollo desmechado'], secret: 'Pollo bien sazonado con comino.', tags: ['completa'] },
            { module: 'fritos', category: 'arepas', name: 'Arepa de Huevo Queso', time: '40m', diff: 'Difícil', prep: ['Introducir cubos de queso costeño en la arepa.', 'Añadir el huevo crudo, sellar y freír.'], ing: ['Masa maíz', 'Huevo', 'Queso costeño'], secret: 'Doble queso para mayor placer.', tags: ['queso'] },

            // Carimañolas y Papas
            { module: 'fritos', category: 'carimanolas', name: 'Carimañola Carne', time: '50m', diff: 'Media', prep: ['Cocinar yuca en agua con sal hasta que ablande bien.', 'Escurrir y retirar la vena central.', 'Moler la yuca INMEDIATAMENTE mientras está caliente (paso crítico).', 'Amasar el puré con un poco de aceite hasta obtener una masa suave.', 'Engrasar las manos, tomar una porción, hacer un disco, rellenar con carne molida guisada (seca).', 'Cerrar dando forma de zepelín (ovalada con puntas).', 'Freír en aceite muy caliente.'], ing: ['Yuca harinosa', 'Carne molida guisada', 'Aceite'], secret: 'Si la yuca se enfría antes de moler, la masa queda grumosa y dura. Debe ser en caliente.', tags: ['yuca', 'costeño'] },
            { module: 'fritos', category: 'carimanolas', name: 'Carimañola Queso', time: '40m', diff: 'Media', prep: ['Hacer la masa de yuca igual que la de carne.', 'Rellenar con bastones gruesos de queso costeño.', 'Cerrar y freír hasta dorar.'], ing: ['Masa de yuca', 'Queso costeño'], secret: 'El queso costeño es ideal porque es salado y resiste el calor sin fundirse totalmente y salirse.', tags: ['queso'] },
            { module: 'fritos', category: 'carimanolas', name: 'Carimañola Pollo', time: '45m', diff: 'Media', prep: ['Rellenar la masa de yuca con pollo guisado desmechado.', 'Cerrar en forma de zepelín y freír.'], ing: ['Masa yuca', 'Pollo guisado'], secret: 'El pollo debe estar desmechado muy fino.', tags: ['yuca'] },
            { module: 'fritos', category: 'carimanolas', name: 'Papa Rellena Clásica', time: '60m', diff: 'Media', prep: ['Cocinar papas pastusas peladas con sal hasta que estén blandas.', 'Triturar para hacer puré (NO añadir leche ni mantequilla, solo sal). Dejar enfriar.', 'Tomar una porción de puré en la mano, hacer un hueco, rellenar con carne guisada y huevo duro.', 'Cerrar formando una bola perfecta.', 'Preparar una tempura (mezcla para rebozar) con harina, huevo, agua, sal y color.', 'Pasar la bola por la tempura y freír en aceite caliente hasta dorar.'], ing: ['Papas pastusas', 'Guiso carne', 'Huevo duro', 'Tempura (harina/huevo/agua)'], secret: 'El rebozado es vital para crear la capa crocante externa y evitar que la papa se desbarate en el aceite.', tags: ['papa', 'callejero'] },
            { module: 'fritos', category: 'carimanolas', name: 'Papa Rellena Queso', time: '50m', diff: 'Media', prep: ['Hacer el puré base de papa.', 'Preparar relleno de queso mezclado con espinaca salteada (sin líquido).', 'Rellenar, cerrar, pasar por rebozado y freír.'], ing: ['Papa', 'Queso', 'Espinaca', 'Rebozado'], secret: 'Apretar bien la bola de puré para sacar el aire antes de rebozar.', tags: ['vege'] },
            { module: 'fritos', category: 'carimanolas', name: 'Papa Rellena Atún', time: '50m', diff: 'Media', prep: ['Hacer un guiso seco de atún con tomate y cebolla.', 'Rellenar la papa, pasar por tempura y freír.'], ing: ['Papa', 'Atún lata', 'Guiso', 'Rebozado'], secret: 'Una opción económica y deliciosa para variar.', tags: ['pescado'] },
            { module: 'fritos', category: 'carimanolas', name: 'Papa Rellena Pollo', time: '55m', diff: 'Media', prep: ['Rellenar la papa con guiso de pollo desmechado.', 'Rebozar y freír.'], ing: ['Papa', 'Pollo guisado', 'Rebozado'], secret: 'El pollo debe estar jugoso pero no líquido.', tags: ['pollo'] },
            { module: 'fritos', category: 'carimanolas', name: 'Aborrajado', time: '30m', diff: 'Media', prep: ['Cortar plátano maduro (cáscara negra) en trozos y freír hasta dorar.', 'Aplanar cada trozo (como un patacón).', 'Poner una lámina de queso y un poco de bocadillo en el centro.', 'Doblar y cerrar formando una bola o cilindro, asegurando que el relleno quede dentro.', 'Pasar por una mezcla de rebozado (harina, huevo, leche, azúcar) y freír nuevamente.'], ing: ['Plátano maduro', 'Queso', 'Bocadillo', 'Mezcla rebozado dulce'], secret: 'El plátano debe estar bien maduro para que sea dulce y suave.', tags: ['dulce-salado'] },
            { module: 'fritos', category: 'carimanolas', name: 'Marranitas', time: '40m', diff: 'Media', prep: ['Freír plátano verde en trozos grandes. Aplastar para hacer una lámina.', 'Poner chicharrón picado carnudo en el centro.', 'Cerrar formando una bola cubriendo el chicharrón.', 'Freír nuevamente hasta dorar.'], ing: ['Plátano verde', 'Chicharrón frito picado', 'Ajo'], secret: 'El chicharrón debe estar bien crocante antes de rellenar.', tags: ['cali'] },
            { module: 'fritos', category: 'carimanolas', name: 'Chuleta Valluna', time: '30m', diff: 'Media', prep: ['Aplanar lomo de cerdo hasta que quede muy fino.', 'Pasar por harina de trigo, luego huevo batido y finalmente miga de pan.', 'Freír en aceite caliente.'], ing: ['Lomo cerdo', 'Miga pan', 'Huevo', 'Harina'], secret: 'Marinar la carne en agua de ajo antes de apanar.', tags: ['frito'] },

            // Buñuelos y Palitos
            { module: 'fritos', category: 'bunuelos', name: 'Buñuelo Tradicional', time: '30m', diff: 'Media', prep: ['Moler el queso costeño muy fino (polvo).', 'En un tazón, mezclar el queso con la fécula de maíz, el almidón de yuca, el azúcar y la sal.', 'Añadir los huevos y amasar con la mano hasta obtener una textura suave y homogénea.', 'Formar bolas perfectas sin grietas.', 'Calentar el aceite a temperatura media (150°C). Si está muy caliente se queman por fuera y quedan crudos; si muy frío se enchumban.', 'Freír hasta que doren y floten girando solos.'], ing: ['1 taza Queso costeño molido', '1 taza fécula maíz', '1/4 taza almidón yuca', '2 huevos', '1 cdta azúcar'], secret: 'Prueba del aceite: echa una bolita de masa, debe demorar unos 5-8 segundos en subir a la superficie y flotar.', tags: ['navidad', 'maíz'] },
            { module: 'fritos', category: 'bunuelos', name: 'Buñuelo Relleno', time: '35m', diff: 'Media', prep: ['Hacer la masa de buñuelo tradicional.', 'Al armar la bola, introducir un cubo de bocadillo o arequipe en el centro.', 'Cerrar muy bien asegurando que no quede expuesto.', 'Freír con cuidado.'], ing: ['Masa buñuelo', 'Bocadillo o Arequipe'], secret: 'El relleno debe estar frío o congelado para que no se derrita demasiado rápido y se salga.', tags: ['postre'] },
            { module: 'fritos', category: 'bunuelos', name: 'Palito de Queso', time: '30m', diff: 'Fácil', prep: ['Hacer una masa de harina de trigo elástica (tipo dedito o tequeño).', 'Cortar el queso costeño en bastones largos.', 'Estirar la masa y cortar en tiras largas.', 'Enrollar la tira de masa alrededor del queso en espiral, cubriéndolo totalmente.', 'Asegurar bien las puntas.', 'Freír en aceite caliente.'], ing: ['Harina trigo', 'Mantequilla', 'Agua', 'Queso costeño bloque'], secret: 'Pellizcar las puntas y traslapar bien la masa para que no escape el queso al fundirse.', tags: ['dedito'] },
            { module: 'fritos', category: 'bunuelos', name: 'Palito Jamón', time: '30m', diff: 'Fácil', prep: ['Enrollar el bastón de queso en una loncha de jamón.', 'Luego proceder a enrollar la masa sobre el jamón y queso.', 'Freír.'], ing: ['Masa trigo', 'Queso', 'Jamón'], secret: 'Doble sabor y protección para el queso.', tags: ['mix'] },
            { module: 'fritos', category: 'bunuelos', name: 'Palito Coco', time: '30m', diff: 'Fácil', prep: ['Hacer la masa con un poco más de azúcar.', 'Armar el palito de queso.', 'Pasar por huevo batido y luego revolcar en coco rallado.', 'Freír con cuidado.'], ing: ['Masa dulce', 'Queso', 'Coco rallado'], secret: 'El aceite no debe estar muy caliente porque el coco se quema rápido.', tags: ['dulce'] },
            { module: 'fritos', category: 'bunuelos', name: 'Palito Bocadillo', time: '30m', diff: 'Fácil', prep: ['Enrollar un trozo de queso y uno de bocadillo juntos con la masa.', 'Freír.'], ing: ['Masa', 'Queso', 'Bocadillo'], secret: 'Combinación clásica de dulce y salado.', tags: ['dulce'] },
            { module: 'fritos', category: 'bunuelos', name: 'Palito Hawaiano', time: '30m', diff: 'Fácil', prep: ['Enrollar jamón, queso y un trozo de piña calada con la masa.', 'Freír.'], ing: ['Masa', 'Jamón', 'Piña', 'Queso'], secret: 'La piña debe estar bien seca.', tags: ['agridulce'] },
            { module: 'fritos', category: 'bunuelos', name: 'Tequeños', time: '30m', diff: 'Media', prep: ['Preparar una masa de harina de trigo elástica con mantequilla.', 'Usar queso duro llanero o costeño bajo en sal cortado en bastones.', 'Enrollar la masa cubriendo el queso completamente.', 'Freír.'], ing: ['Harina trigo', 'Mantequilla', 'Huevo', 'Queso duro'], secret: 'El queso debe ser duro y salado para aguantar la temperatura.', tags: ['fiesta'] },

            // Otros
            { module: 'fritos', category: 'otros', name: 'Arepuelas', time: '20m', diff: 'Fácil', prep: ['Mezclar harina de trigo, huevo, azúcar, pizca de sal, semillas de anís y un poco de agua o leche.', 'Amasar hasta obtener una masa suave.', 'Estirar discos delgados con rodillo.', 'Freír en aceite caliente hasta que doren y se abomben.'], ing: ['Harina trigo', 'Huevo', 'Azúcar', 'Semillas anís'], secret: 'Deben quedar crujientes en los bordes y suaves en el centro.', tags: ['café'] },
            { module: 'fritos', category: 'otros', name: 'Patacones (Tostones)', time: '25m', diff: 'Fácil', prep: ['Pelar plátanos verdes y cortar en trozos de 3-4 cm.', 'Freír en aceite medio hasta que estén cocidos por dentro pero pálidos.', 'Sacar y aplastar con pataconera (pisar).', 'Pasar rápidamente por agua de ajo con sal.', 'Freír por segunda vez en aceite bien caliente hasta dorar.'], ing: ['Plátanos verdes machos', 'Aceite', 'Ajo machacado', 'Sal'], secret: 'El paso por agua de ajo antes de la segunda fritura es lo que les da el sabor característico y la crocancia.', tags: ['acompañamiento'] },
            { module: 'fritos', category: 'otros', name: 'Papas Chorreadas', time: '40m', diff: 'Fácil', prep: ['Cocinar papas rojas enteras con piel en agua con sal.', 'Aparte, hacer un guiso (hogao) abundante con tomate y cebolla.', 'Añadir crema de leche y queso rallado al guiso, cocinar hasta espesar.', 'Servir las papas calientes bañadas con la salsa.'], ing: ['Papas rojas', 'Tomate/Cebolla', 'Crema de leche', 'Queso'], secret: 'Aunque no son fritas, son el acompañamiento clásico de la fritanga. La salsa debe ser abundante.', tags: ['almuerzo'] },
            { module: 'fritos', category: 'otros', name: 'Maduros Rellenos', time: '30m', diff: 'Media', prep: ['Freír el plátano maduro entero pelado (o hornear).', 'Abrir una ranura a lo largo sin separar.', 'Rellenar con queso mozzarella y bocadillo.', 'Llevar al horno o sartén tapada para gratinar.'], ing: ['Plátano muy maduro', 'Queso mozzarella', 'Bocadillo'], secret: 'El plátano debe tener la cáscara negra para que sea dulce y suave.', tags: ['dulce'] },
            { module: 'fritos', category: 'otros', name: 'Kibbeh', time: '40m', diff: 'Media', prep: ['Hidratar trigo americano.', 'Mezclar con carne molida cruda y especias árabes.', 'Formar zepelines y rellenar con guiso de carne y piñones.', 'Freír hasta oscurecer.'], ing: ['Trigo americano', 'Carne molida', 'Yerbabuena'], secret: 'La carne de la masa debe ser muy magra (sin grasa).', tags: ['arabe'] },

            // Salsas (Cap 9)
            { module: 'fritos', category: 'salsas', name: 'Hogao Valluno', time: '20m', diff: 'Fácil', prep: ['Picar cebolla larga (junca) y tomate maduro muy finamente.', 'Calentar aceite con achiote (color) en una sartén.', 'Sofreír primero la cebolla hasta que transparente.', 'Agregar el tomate, sal y comino.', 'Cocinar a fuego muy bajo por 20 minutos revolviendo ocasionalmente hasta obtener una pasta suave.'], ing: ['Cebolla larga', 'Tomates maduros', 'Achiote', 'Comino'], secret: 'El tiempo lento es clave. Si se seca, añade una cucharadita de leche o agua.', tags: ['salsa', 'base'] },
            { module: 'fritos', category: 'salsas', name: 'Ají Picante', time: '10m', diff: 'Fácil', prep: ['Picar finamente ajíes, cebolla larga y cilantro.', 'Poner en un frasco de vidrio.', 'Cubrir con partes iguales de agua y vinagre blanco.', 'Añadir sal y un chorrito de limón.', 'Dejar reposar al menos 2 horas antes de usar.'], ing: ['Ají picante', 'Cebolla larga', 'Cilantro', 'Vinagre blanco'], secret: 'Para bajar el picante, retira las venas y semillas del ají antes de picar.', tags: ['picante'] },
            { module: 'fritos', category: 'salsas', name: 'Guacamole', time: '10m', diff: 'Fácil', prep: ['Triturar la pulpa de aguacate maduro con un tenedor (dejar algunos trozos).', 'Mezclar con cebolla picada, tomate picado (sin semillas) y cilantro.', 'Añadir jugo de limón y sal inmediatamente.'], ing: ['Aguacates hass', 'Tomate', 'Cebolla', 'Cilantro', 'Limón'], secret: 'El limón evita la oxidación. Dejar la pepa (hueso) dentro de la salsa ayuda a conservar el color.', tags: ['crema'] },
            { module: 'fritos', category: 'salsas', name: 'Salsa Tamarindo', time: '20m', diff: 'Media', prep: ['Sacar la pulpa de tamarindo (o usar concentrado).', 'Poner en una olla con azúcar, un poco de vinagre y una pizca de sal.', 'Cocinar hasta reducir y obtener textura de salsa BBQ.', 'Colar si se desea muy fina.'], ing: ['Pulpa tamarindo', 'Azúcar', 'Vinagre', 'Ketchup (opcional)'], secret: 'El equilibrio agridulce es perfecto para fritos de mar o empanadas de carne.', tags: ['fruta', 'agridulce'] },
            { module: 'fritos', category: 'salsas', name: 'Ajo y Limón', time: '5m', diff: 'Fácil', prep: ['En un bowl, poner mayonesa base.', 'Añadir pasta de ajo (o ajo machacado muy fino).', 'Incorporar jugo de limón y perejil picado.', 'Mezclar bien.'], ing: ['Mayonesa', 'Ajo', 'Limón', 'Perejil'], secret: 'Usar ajo asado en vez de crudo para un sabor más suave y sofisticado.', tags: ['blanca'] },
            { module: 'fritos', category: 'salsas', name: 'Cilantro Yogur', time: '5m', diff: 'Fácil', prep: ['Poner en licuadora: yogur griego natural, un manojo grande de cilantro, jugo de limón, sal y un diente de ajo pequeño.', 'Licuar hasta que esté verde y homogéneo.'], ing: ['Yogur griego sin dulce', 'Cilantro', 'Limón', 'Ajo'], secret: 'Una salsa ligera ideal para balancear la grasa de los fritos.', tags: ['verde', 'light'] },
            { module: 'fritos', category: 'salsas', name: 'Miel Mostaza', time: '5m', diff: 'Fácil', prep: ['Mezclar en un bowl partes iguales de miel de abejas y mostaza.', 'Añadir unas gotas de limón para equilibrar.'], ing: ['Miel', 'Mostaza', 'Limón'], secret: 'Usar mostaza antigua (con granos) para mejor textura.', tags: ['pollo'] },
            { module: 'fritos', category: 'salsas', name: 'Salsa Guayaba', time: '20m', diff: 'Media', prep: ['Picar bocadillo veleño en cubos.', 'Poner en olla con un poco de agua caliente.', 'Cocinar removiendo hasta que se funda y sea una salsa.', 'Añadir unas gotas de limón o vinagre.'], ing: ['Bocadillo (pasta guayaba)', 'Agua', 'Limón'], secret: 'Añadir un poco de chipotle o ají para una versión picante deliciosa.', tags: ['dulce'] },
            { module: 'fritos', category: 'salsas', name: 'Tomate y Ajo', time: '15m', diff: 'Fácil', prep: ['Rallar tomates maduros (sin piel).', 'Mezclar el puré fresco con ajo machacado, aceite de oliva, sal y orégano.', 'No cocinar.'], ing: ['Tomate rojo', 'Ajo', 'Aceite oliva', 'Orégano'], secret: 'Salsa fresca tipo "tumaca" ideal para empanadas de queso.', tags: ['roja'] },
            { module: 'fritos', category: 'salsas', name: 'Cebolla Vinagre', time: '30m', diff: 'Fácil', prep: ['Cortar cebolla roja en plumas muy finas.', 'Pasar por agua hirviendo 1 minuto y escurrir (blanquear).', 'Poner en un frasco con vinagre, sal, limón y pimienta.'], ing: ['Cebolla roja', 'Vinagre blanco', 'Limón'], secret: 'Es el acompañante obligatorio de la butifarra.', tags: ['ácido'] },
            { module: 'fritos', category: 'salsas', name: 'Suero Costeño', time: '10m', diff: 'Media', prep: ['Versión rápida: Mezclar crema de leche espesa (o crema agria) con jugo de limón y sal al gusto. Dejar reposar 10 min.', 'Versión tradicional: Dejar fermentar leche cruda en ambiente cálido, separar el suero y batir con sal.'], ing: ['Crema de leche/Agria', 'Limón', 'Sal'], secret: 'El punto de sal debe ser un poco alto.', tags: ['costeño'] },
            { module: 'fritos', category: 'salsas', name: 'Salsa Piña', time: '15m', diff: 'Fácil', prep: ['Picar piña oro miel en cubitos diminutos.', 'Poner en sartén con azúcar y dejar calar (cocinar) en su propio jugo hasta que esté brillante.', 'Dejar enfriar.'], ing: ['Piña', 'Azúcar'], secret: 'No licuar, los trocitos son la clave.', tags: ['dulce'] },
            { module: 'fritos', category: 'salsas', name: 'Salsa Tocineta', time: '15m', diff: 'Fácil', prep: ['Picar tocineta muy fina y freír hasta que esté crocante.', 'Mezclar la tocineta (y un poco de su grasa) con mayonesa o crema de leche y queso crema.', 'Añadir pimienta.'], ing: ['Tocineta', 'Mayonesa/Queso crema'], secret: 'Usar la grasa de la tocineta da todo el sabor.', tags: ['sabor'] },
            { module: 'fritos', category: 'salsas', name: 'Salsa Showi', time: '5m', diff: 'Fácil', prep: ['Mezclar mayonesa, salsa de tomate (ketchup), mostaza, un poco de salsa negra (inglesa) y ajo en polvo.', 'Integrar bien.'], ing: ['Mayonesa', 'Ketchup', 'Mostaza', 'Salsa negra', 'Ajo'], secret: 'Es la versión mejorada de la salsa rosada, llena de umami.', tags: ['rápido'] },
            { module: 'fritos', category: 'salsas', name: 'Salsa Tártara', time: '10m', diff: 'Fácil', prep: ['Partir de una base de mayonesa.', 'Picar muy finamente: alcaparras, cebolla, perejil y huevo duro.', 'Mezclar todo con la mayonesa y un chorrito de limón.'], ing: ['Mayonesa', 'Alcaparras', 'Cebolla', 'Huevo duro', 'Perejil'], secret: 'Dejar reposar en nevera para que los sabores se integren.', tags: ['pescado'] },
            { module: 'fritos', category: 'salsas', name: 'Guasacaca', time: '10m', diff: 'Fácil', prep: ['Licuar aguacate, pimentón verde, cebolla, ajo, cilantro, vinagre y aceite.', 'Debe quedar una salsa verde lisa y fluida.'], ing: ['Aguacate', 'Pimentón verde', 'Vinagre', 'Cilantro'], secret: 'A diferencia del guacamole, esta es una salsa líquida y vinagrosa.', tags: ['verde'] },
            { module: 'fritos', category: 'salsas', name: 'Cilantro Limón', time: '5m', diff: 'Fácil', prep: ['Picar mucho cilantro y cebolla larga muy fino.', 'Mezclar con aceite vegetal, vinagre, limón y sal.'], ing: ['Cilantro', 'Cebolla larga', 'Aceite', 'Limón'], secret: 'Una especie de chimichurri criollo fresco.', tags: ['ensalada'] },
            { module: 'fritos', category: 'salsas', name: 'Aguacate Tomatillo', time: '10m', diff: 'Media', prep: ['Asar tomatillos verdes y chiles en sartén.', 'Licuar con pulpa de aguacate, ajo y cilantro.', 'Sazonar.'], ing: ['Tomatillos', 'Aguacate', 'Chile'], secret: 'Salsa verde picante estilo mexicano.', tags: ['picante'] },
            { module: 'fritos', category: 'salsas', name: 'Salsa Mango', time: '10m', diff: 'Fácil', prep: ['Picar mango biche (verde) o pintón en tiritas o cubos finos.', 'Mezclar con jugo de limón, sal y pimienta.'], ing: ['Mango biche', 'Limón', 'Pimienta'], secret: 'Textura crocante y sabor ácido.', tags: ['fruta'] },
            { module: 'fritos', category: 'salsas', name: 'Salsa Coco', time: '15m', diff: 'Media', prep: ['Poner leche de coco en una olla con un trozo de panela y un ají entero.', 'Reducir hasta que espese un poco.', 'Retirar ají.'], ing: ['Leche coco', 'Panela', 'Ají dulce/picante'], secret: 'Ideal para acompañar fritos de pescado.', tags: ['costeño'] },

            // ==========================================

            { module: 'bbq', category: 'cerdo', name: 'Costillar St. Louis', time: '4h', diff: 'Media', prep: ['Retirar la membrana trasera del hueso (es dura e impide el paso del sabor).', 'Aplicar una capa fina de mostaza como pegamento.', 'Espolvorear el Rub (mezcla de especias) generosamente por ambos lados.', 'Llevar al barril o ahumador a 120°C (250°F) por 3-4 horas.', 'Rociar con jugo de manzana cada hora para mantener humedad.', 'Envolver en aluminio la última hora si se quiere muy suave.'], ing: ['Costillar de cerdo corte St. Louis', 'Rub BBQ', 'Mostaza', 'Jugo de manzana'], secret: 'La prueba de fuego: cuando la carne se retraiga del hueso aprox 1cm, están listas.', tags: ['lento'] },
            { module: 'bbq', category: 'cerdo', name: 'Costillas Miel Mostaza', time: '3h', diff: 'Media', prep: ['Seguir el proceso de ahumado normal del costillar.', 'Mezclar miel y mostaza en un bowl.', 'En los últimos 30 minutos de cocción, pincelar las costillas con la mezcla.', 'Dejar caramelizar sin que se queme.'], ing: ['Costillas', 'Miel', 'Mostaza Dijon'], secret: 'Si el fuego es muy alto, la miel se quema rápido y amarga. Pincelar solo al final.', tags: ['glaseado'] },
            { module: 'bbq', category: 'cerdo', name: 'Costillas Coreanas (Galbi)', time: '2h', diff: 'Media', prep: ['Usar costilla de res o cerdo cortada transversalmente (flanken/asado de tira).', 'Marinar 2 horas en salsa de soja, aceite de sésamo, pera asiática rallada, ajo, jengibre y azúcar.', 'Asar a fuego directo muy caliente y rápido.'], ing: ['Costillas corte flanken', 'Salsa soja', 'Aceite sésamo', 'Pera asiática'], secret: 'La pera asiática tiene enzimas que ablandan la carne increíblemente.', tags: ['internacional'] },
            { module: 'bbq', category: 'cerdo', name: 'Costillas Ciruela', time: '2.5h', diff: 'Media', prep: ['Ahumar las costillas con sal y pimienta.', 'Hacer una salsa reduciendo mermelada de ciruela, vinagre y un toque de soya.', 'Pincelar las costillas con la salsa durante la última hora de cocción.'], ing: ['Costillas', 'Mermelada de ciruela', 'Vinagre', 'Soya'], secret: 'Aporta un color oscuro brillante y sabor agridulce sofisticado.', tags: ['agridulce'] },
            { module: 'bbq', category: 'cerdo', name: 'Chicharrón Crujiente', time: '2h', diff: 'Media', prep: ['Hacer cortes transversales en la carne del tocino sin llegar a cortar la piel.', 'Aplicar sal y bicarbonato de sodio SOLO en la piel. Dejar secar en nevera destapado (piel arriba) desde la noche anterior.', 'Asar en barril a fuego medio-alto (180°C) hasta que la piel estalle y burbujee.'], ing: ['Tocino barriguero carnudo', 'Sal', 'Bicarbonato de sodio'], secret: 'La piel debe estar completamente seca para que quede crocante (efecto galleta). La humedad es enemiga de la crocancia.', tags: ['crocante'] },
            { module: 'bbq', category: 'cerdo', name: 'Chicharrón Limón', time: '2h', diff: 'Media', prep: ['Marinar la carne del tocino con abundante jugo de limón y sal (evitar mojar la piel si se quiere crocante).', 'Asar colgado en el barril.', 'Al servir, rallar cáscara de limón fresca encima.'], ing: ['Tocino', 'Limones', 'Sal'], secret: 'El ácido del limón ayuda a cortar la sensación de grasa al comer.', tags: ['ácido'] },
            { module: 'bbq', category: 'cerdo', name: 'Bondiola Ahumada', time: '6h', diff: 'Media', prep: ['Usar cabeza de lomo (bondiola).', 'Aplicar rub de cerdo abundante.', 'Ahumar a 120°C hasta alcanzar temperatura interna de 90°C (para desmechar).', 'Dejar reposar y deshebrar con tenedores.'], ing: ['Bondiola de cerdo', 'Rub dulce/picante'], secret: 'Ideal para sándwiches de Pulled Pork. Mezclar con salsa BBQ al final.', tags: ['pulled pork'] },
            { module: 'bbq', category: 'cerdo', name: 'Lomo al Trapo', time: '40m', diff: 'Difícil', prep: ['Empapar un trapo de algodón limpio en vino tinto.', 'Extender el trapo, poner una cama gruesa de sal (1cm).', 'Poner el lomo de cerdo (o res) encima, cubrir con más sal y enrollar el trapo apretado. Amarrar con piola.', 'Poner directamente sobre las brasas (fuego vivo) 15-20 min por lado.', 'Retirar, romper la costra de sal y limpiar.'], ing: ['Lomo de cerdo', 'Trapo algodón', 'Vino tinto', 'Sal (1kg)'], secret: 'El trapo húmedo no se quema, y la sal crea un horno hermético que cocina la carne en su jugo.', tags: ['espectáculo'] },
            { module: 'bbq', category: 'res', name: 'Brisket Texas', time: '12h', diff: 'Difícil', prep: ['Limpiar el exceso de grasa exterior dejando una capa de 6mm.', 'Sazonar solo con Sal Kosher y Pimienta Negra (partes iguales - Dalmatian Rub).', 'Ahumar a baja temperatura (107°C) hasta que la temperatura interna llegue a 74°C (aprox 6-7 horas).', 'Envolver en papel carnicero (Texas Crutch) y volver al calor hasta llegar a 93°C internos o que se sienta como mantequilla al pinchar.', 'Reposar en una hielera seca por 2 horas antes de cortar.'], ing: ['Pecho de res entero', 'Sal Kosher', 'Pimienta negra 16 mesh'], secret: 'El reposo es crucial. Si cortas antes, todos los jugos se perderán y quedará seco.', tags: ['lento', 'experto'] },
            { module: 'bbq', category: 'res', name: 'Picanha (Punta de Anca)', time: '45m', diff: 'Media', prep: ['Hacer cortes en rombos en la grasa superficial.', 'Sellar primero por el lado de la grasa para derretirla.', 'Asar a fuego indirecto hasta temperatura interna de 63°C (Término Medio).', 'Dejar reposar 10 min antes de cortar.'], ing: ['Punta de Anca', 'Sal gruesa'], secret: 'Cortar siempre en contra de la fibra para máxima suavidad.', tags: ['rápido'] },
            { module: 'bbq', category: 'res', name: 'Tomahawk', time: '40m', diff: 'Fácil', prep: ['Salpimentar la pieza.', 'Usar método de sellado inverso: Asar primero a fuego indirecto hasta que falten 5°C para el término deseado.', 'Pasar a fuego directo muy fuerte para dorar la costra (1 min por lado).', 'Terminar con un trozo de mantequilla encima mientras reposa.'], ing: ['Tomahawk Steak', 'Mantequilla', 'Sal/Pimienta'], secret: 'Envolver el hueso expuesto en aluminio para que no se ponga negro estéticamente.', tags: ['premium'] },
            { module: 'bbq', category: 'res', name: 'Entraña', time: '10m', diff: 'Fácil', prep: ['Retirar los cueros (membranas) de ambos lados si no los han quitado.', 'Fuego muy alto (arrebatado).', 'Asar 3-4 minutos por lado.', 'Sal preferiblemente al final.'], ing: ['Entraña fina', 'Sal marina'], secret: 'Es un corte para comer jugoso. Si se pasa de término se pone duro.', tags: ['rápido'] },
            { module: 'bbq', category: 'res', name: 'Asado de Tira', time: '30m', diff: 'Media', prep: ['Costilla de res corte ventana (transversal).', 'Fuego medio.', 'Empezar asando del lado del hueso.', 'Dar vuelta y dorar.', 'Salmuera durante la cocción.'], ing: ['Costilla de res', 'Sal'], secret: 'La grasa debe quedar dorada y crocante, no blanca.', tags: ['clásico'] },
            { module: 'bbq', category: 'pollo', name: 'Pollo Entero Barril', time: '1.5h', diff: 'Fácil', prep: ['Marinar el pollo entero desde la noche anterior con jugo de naranja, cerveza, ajo, cebolla y romero.', 'Colocar en el gancho del barril verticalmente.', 'Cocinar a 180°C durante 1 hora y media.', 'Verificar que la temperatura interna en la pechuga sea de 74°C.'], ing: ['Pollo entero', 'Naranja agria', 'Cerveza', 'Ajo/Hierbas'], secret: 'Introducir mantequilla con hierbas bajo la piel de la pechuga para que quede extra jugosa.', tags: ['familiar'] },
            { module: 'bbq', category: 'pollo', name: 'Alitas BBQ', time: '45m', diff: 'Fácil', prep: ['Secar bien las alitas.', 'Aplicar Rub de pollo.', 'Asar a fuego indirecto para cocinar sin quemar.', 'Cuando estén casi listas y la piel crocante, bañar en salsa BBQ y dejar caramelizar 5 min.'], ing: ['Alitas de pollo', 'Rub pollo', 'Salsa BBQ'], secret: 'Nunca poner la salsa al principio o el azúcar se quemará y la piel quedará blanda.', tags: ['snack'] },
            { module: 'bbq', category: 'pollo', name: 'Muslos Rellenos', time: '1h', diff: 'Media', prep: ['Deshuesar los muslos manteniendo la piel.', 'Rellenar con un bastón de queso y una loncha de jamón/tocineta.', 'Cerrar y bridar (amarrar con hilo) o usar palillos.', 'Asar.'], ing: ['Muslos de pollo', 'Queso', 'Jamón/Tocineta'], secret: 'Cerrar bien la piel para proteger la carne.', tags: ['relleno'] },
            { module: 'bbq', category: 'otros_carnes', name: 'Cordero Rack', time: '30m', diff: 'Media', prep: ['Limpiar los huesos de las costillas (frenching).', 'Sellar a fuego alto por todos lados.', 'Terminar a fuego indirecto hasta 60°C (rosado).', 'Servir con salsa de menta.'], ing: ['Rack de cordero', 'Romero', 'Ajo', 'Aceite oliva'], secret: 'El cordero se debe comer a término medio, si se seca pierde su encanto.', tags: ['gourmet'] },
            { module: 'bbq', category: 'otros_carnes', name: 'Pavo Ahumado', time: '3h', diff: 'Media', prep: ['Inyectar la pechuga con una mezcla de mantequilla derretida y caldo/vino.', 'Frotar la piel con mantequilla.', 'Asar a 150°C hasta que el interior marque 74°C.', 'Glasear con jarabe de arce al final.'], ing: ['Pechuga de pavo', 'Jarabe de Arce', 'Mantequilla', 'Vino blanco'], secret: 'El pavo se seca muy fácil, la inyección y el termómetro son obligatorios.', tags: ['festivo'] },
            { module: 'bbq', category: 'pescado', name: 'Salmón Tabla Cedro', time: '20m', diff: 'Fácil', prep: ['Remojar una tabla de cedro en agua por 2 horas.', 'Poner el filete de salmón sobre la tabla.', 'Cubrir con mantequilla, limón y eneldo.', 'Poner la tabla sobre la parrilla y tapar.', 'El calor hará humear la madera perfumando el pescado.'], ing: ['Filete salmón', 'Tabla cedro', 'Mantequilla', 'Eneldo'], secret: 'El pescado no se voltea, se cocina por el vapor y humo.', tags: ['pescado'] },
            { module: 'bbq', category: 'pescado', name: 'Trucha Limón', time: '15m', diff: 'Fácil', prep: ['Usar trucha entera abierta mariposa.', 'Rellenar con rodajas de limón y hierbas.', 'Usar una canastilla de pescado para poder voltear sin romper.', 'Asar a fuego medio hasta que la piel esté tostada.'], ing: ['Trucha', 'Limón', 'Aceite oliva', 'Perejil'], secret: 'La piel debe soltarse sola de la rejilla; si se pega, le falta cocción.', tags: ['pescado'] },
            { module: 'bbq', category: 'acompanamiento', name: 'Papas al Plomo', time: '40m', diff: 'Fácil', prep: ['Cortar papas en rodajas o cubos.', 'Poner sobre papel aluminio con cebolla, mantequilla, sal y pimienta.', 'Cerrar el paquete herméticamente.', 'Poner directamente sobre las brasas.'], ing: ['Papas', 'Mantequilla', 'Cebolla', 'Papel aluminio'], secret: 'El vapor cocina la papa y la mantequilla la dora.', tags: ['guarnición'] },
            { module: 'bbq', category: 'acompanamiento', name: 'Piña Asada', time: '20m', diff: 'Fácil', prep: ['Pelar la piña y cortar en rodajas gruesas o bastones.', 'Asar a fuego directo hasta que tenga marcas de parrilla.', 'Espolvorear con canela y azúcar mientras está caliente.'], ing: ['Piña oro miel', 'Canela en polvo', 'Azúcar (opcional)'], secret: 'Excelente postre de parrilla que ayuda a la digestión.', tags: ['postre'] },
            { module: 'bbq', category: 'acompanamiento', name: 'Espárragos', time: '10m', diff: 'Fácil', prep: ['Cortar la parte dura del tallo.', 'Bañar en aceite de oliva, sal y pimienta.', 'Asar a fuego alto rápido (deben quedar al dente).', 'Terminar con queso parmesano y un chorro de limón.'], ing: ['Espárragos verdes', 'Aceite oliva', 'Parmesano', 'Limón'], secret: 'Crocantes, nunca blandos.', tags: ['vege'] },
            { module: 'bbq', category: 'acompanamiento', name: 'Mazorca', time: '20m', diff: 'Fácil', prep: ['Asar las mazorcas primero con su propia hoja (remojada) para cocinar al vapor.', 'Luego quitar hojas y dorar los granos a fuego directo.', 'Untar mantequilla y sal.'], ing: ['Mazorca dulce', 'Mantequilla', 'Sal'], secret: 'Estilo callejero: untar mayonesa, queso rallado y chile en polvo.', tags: ['clásico'] },
            { module: 'bbq', category: 'acompanamiento', name: 'Papas Ahumadas', time: '45m', diff: 'Fácil', prep: ['Lavar papas y pincharlas.', 'Colocarlas enteras en la rejilla superior del barril/ahumador mientras se hacen las carnes.', 'Cuando estén blandas, pelar (la piel tendrá sabor a humo).', 'Machacar con mantequilla y leche.'], ing: ['Papa pastusa', 'Mantequilla', 'Leche'], secret: 'El sabor a humo penetra y transforma un puré simple en algo extraordinario.', tags: ['guarnición'] },
            { module: 'bbq', category: 'acompanamiento', name: 'Hasselback', time: '60m', diff: 'Media', prep: ['Lavar papas grandes.', 'Hacer cortes finos transversales sin llegar hasta abajo (usar palillos chinos a los lados como tope).', 'Insertar láminas de mantequilla o ajo entre los cortes.', 'Asar envuelta en aluminio o en bandeja.'], ing: ['Papa grande', 'Mantequilla', 'Romero/Ajo'], secret: 'Se abren como un acordeón y quedan crocantes por fuera.', tags: ['gourmet'] },
            { module: 'bbq', category: 'acompanamiento', name: 'Yuca Frita', time: '45m', diff: 'Media', prep: ['Hervir la yuca en agua con sal hasta que abra.', 'Dejar enfriar y secar bien.', 'Cortar en bastones.', 'Freír en aceite bien caliente.'], ing: ['Yuca', 'Aceite', 'Sal'], secret: 'Si congelas la yuca cocida antes de freír, queda mucho más crocante.', tags: ['frito'] },
            { module: 'bbq', category: 'acompanamiento', name: 'Puré Yuca', time: '30m', diff: 'Fácil', prep: ['Cocinar yuca hasta que esté muy blanda.', 'Retirar la hebra central.', 'Machacar caliente con queso crema, mantequilla y sal.'], ing: ['Yuca', 'Queso crema', 'Mantequilla'], secret: 'Tiene una textura más elástica y chiclosa que el de papa.', tags: ['cremoso'] }
        ];

        // --- UTILS ---
        const convertUnit = (text, toImperial) => {
            if (!toImperial || typeof text !== 'string') return text;
            return text
                .replace(/(\d+)\s*kg/gi, (_, n) => `${(n * 2.2).toFixed(1)} lb`)
                .replace(/(\d+)\s*g/gi, (_, n) => `${(n * 0.035).toFixed(1)} oz`)
                .replace(/(\d+)\s*ml/gi, (_, n) => `${(n * 0.034).toFixed(1)} fl oz`)
                .replace(/(\d+)\s*litro/gi, (_, n) => `${(n * 1.05).toFixed(1)} qt`);
        };

        // --- COMPONENTES ---
        const RecipeCard = ({ recipe, onClick, isFavorite, onToggleFavorite, theme }) => (
            <div onClick={() => onClick(recipe)} className={`bg-white rounded-xl shadow-md overflow-hidden cursor-pointer transform transition hover:scale-[1.02] hover:shadow-lg border flex flex-col h-full relative group ${theme.border}`}>
                <button onClick={(e) => onToggleFavorite(recipe.id, e)} className={`absolute top-2 right-2 z-20 p-2 rounded-full shadow-md transition-all ${isFavorite ? `${theme.bgSolid} text-white scale-110` : 'bg-white/90 text-gray-400 hover:text-red-500'}`}>
                    <Icons.Heart fill={isFavorite ? "currentColor" : "none"} />
                </button>
                <div className={`h-32 bg-gradient-to-br ${theme.gradient} flex items-center justify-center p-4 relative`}>
                    <div className="absolute inset-0 bg-black opacity-5 pattern-grid"></div>
                    {recipe.module === 'jams' ? <Icons.Leaf className="text-white w-12 h-12 relative z-10 opacity-90" /> : 
                     recipe.module === 'bbq' ? <Icons.Flame className="text-white w-12 h-12 relative z-10 opacity-90" /> :
                     <Icons.CookingPot className="text-white w-12 h-12 relative z-10 opacity-90" />}
                    <span className={`absolute bottom-2 right-2 bg-white/90 ${theme.text} text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wide shadow-sm`}>{recipe.category.replace('_', ' ')}</span>
                </div>
                <div className="p-4 flex-grow flex flex-col justify-between">
                    <div>
                        <h3 className="text-xl font-bold text-gray-800 mb-1 leading-tight line-clamp-2 font-serif">{recipe.name}</h3>
                        <div className="flex items-center space-x-3 text-xs text-gray-500 mb-3">
                            <span className="flex items-center"><Icons.Clock /> <span className="ml-1">{recipe.time}</span></span>
                            <span className="flex items-center"><Icons.AlertCircle /> <span className="ml-1">{recipe.diff}</span></span>
                        </div>
                    </div>
                    <button className={`w-full mt-2 py-2 rounded-lg text-sm font-bold ${theme.bgLight} ${theme.text} hover:opacity-80 transition`}>Ver Receta</button>
                </div>
            </div>
        );

        const ShoppingListModal = ({ list, onClose, onRemove, theme }) => (
          <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" onClick={onClose}>
            <div className="bg-white rounded-2xl w-full max-w-md shadow-2xl flex flex-col relative animate-slide-up" onClick={e => e.stopPropagation()}>
              <div className={`${theme.bgSolid} text-white p-4 rounded-t-2xl flex justify-between items-center`}>
                <h3 className="font-bold text-lg flex items-center"><Icons.ShoppingBag className="mr-2" size={20}/> Lista de Compras</h3>
                <button onClick={onClose}><Icons.X size={20}/></button>
              </div>
              <div className="p-4 max-h-[60vh] overflow-y-auto">
                {list.length === 0 ? <p className="text-center text-gray-500 py-4">Tu lista está vacía.</p> : (
                  <ul className="space-y-2">
                    {list.map((item, i) => (
                      <li key={i} className="flex justify-between items-center bg-gray-50 p-2 rounded border border-gray-100 group">
                        <span className="text-sm text-gray-700">{typeof item === 'string' ? item : JSON.stringify(item)}</span>
                        <button onClick={() => onRemove(i)} className="text-gray-400 hover:text-red-500 transition"><Icons.Trash2 size={16}/></button>
                      </li>
                    ))}
                  </ul>
                )}
              </div>
              <div className="p-4 border-t border-gray-100 bg-gray-50 rounded-b-2xl">
                <button onClick={() => { navigator.clipboard.writeText(list.join('\n')); alert('Lista copiada al portapapeles'); }} className={`w-full py-2 rounded-lg font-bold text-sm ${theme.bgLight} ${theme.text} hover:opacity-90 transition`}>Copiar Lista</button>
              </div>
            </div>
          </div>
        );

        const RecipeModal = ({ recipe, onClose, isFavorite, onToggleFavorite, theme, onAddToShoppingList }) => {
          const [portions, setPortions] = useState(1);
          const [checked, setChecked] = useState({});
          const [imperial, setImperial] = useState(false);
          const [cookingMode, setCookingMode] = useState(false);
          const [timer, setTimer] = useState(null);
          const wakeLock = useRef(null);

          useEffect(() => { setPortions(1); setChecked({}); setImperial(false); setTimer(null); }, [recipe]);

          const toggleCookingMode = async () => {
            if (!cookingMode) {
                try { if ('wakeLock' in navigator) wakeLock.current = await navigator.wakeLock.request('screen'); setCookingMode(true); } catch (err) { setCookingMode(true); }
            } else {
                if (wakeLock.current) await wakeLock.current.release(); setCookingMode(false);
            }
          };

          useEffect(() => {
            let interval = null;
            if (timer > 0) interval = setInterval(() => setTimer(t => t - 1), 1000);
            else if (timer === 0) { alert("¡Tiempo terminado!"); setTimer(null); }
            return () => clearInterval(interval);
          }, [timer]);

          const startTimer = (text) => {
              const match = text.match(/(\d+)\s*min/);
              if(match) setTimer(parseInt(match[1]) * 60);
          };

          const formatTime = (s) => `${Math.floor(s / 60)}:${(s % 60 < 10 ? '0' : '')}${s % 60}`;

          if (!recipe) return null;

          const renderIng = (text) => {
            let processedText = convertUnit(text, imperial);
            const match = processedText.match(/^([\d.]+)(\D.*)$/);
            if (match) {
              const val = parseFloat(match[1]);
              if (!isNaN(val)) {
                const newVal = (val * portions).toFixed(1).replace('.0','');
                return `${newVal}${match[2]}`;
              }
            }
            return processedText;
          };

          const modalClass = cookingMode ? "fixed inset-0 z-[100] bg-white overflow-y-auto" : "bg-white rounded-2xl w-full max-w-3xl max-h-[90vh] shadow-2xl flex flex-col relative animate-slide-up";
          const containerClass = cookingMode ? "" : "fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm";

          return (
            <div className={containerClass} onClick={(e) => !cookingMode && onClose()}>
              <div className={modalClass} onClick={e => e.stopPropagation()}>
                <div className={`${theme.bgSolid} text-white p-6 relative flex-shrink-0 flex justify-between items-start`}>
                    <div>
                        <span className="text-xs font-bold uppercase tracking-wider opacity-80 mb-1 block">{MODULES[recipe.module].categories.find(c => c.id === recipe.category)?.name}</span>
                        <h2 className={`${cookingMode ? 'text-5xl' : 'text-3xl'} font-serif font-bold leading-tight`}>{recipe.name}</h2>
                    </div>
                    <div className="flex space-x-2">
                         <button onClick={toggleCookingMode} className="p-2 bg-white/20 hover:bg-white/40 rounded-full transition">{cookingMode ? <Icons.Minimize /> : <Icons.Maximize />}</button>
                        <button onClick={onClose} className="p-2 bg-white/20 hover:bg-white/40 rounded-full transition"><Icons.X /></button>
                    </div>
                </div>
                <div className={`flex-1 overflow-y-auto ${cookingMode ? 'p-8' : 'p-6'} space-y-8`}>
                  {!cookingMode && (
                    <div className="flex flex-wrap gap-4 justify-between items-center bg-gray-50 p-3 rounded-lg border border-gray-100">
                        <div className="flex items-center space-x-4 text-sm text-gray-600">
                            <span className="flex items-center"><Icons.Clock size={16} className="mr-1"/> {recipe.time}</span>
                            <span className="flex items-center"><Icons.AlertCircle size={16} className="mr-1"/> {recipe.diff}</span>
                        </div>
                        <div className="flex items-center space-x-4">
                            <button onClick={() => setImperial(!imperial)} className="flex items-center text-xs font-bold text-gray-500 hover:text-gray-800"><Icons.Scale size={14} className="mr-1"/> {imperial ? 'Imperial' : 'Métrico'}</button>
                            <div className="flex items-center bg-white rounded-md border shadow-sm">
                                <button onClick={() => setPortions(Math.max(0.5, portions-0.5))} className="p-1 hover:bg-gray-100"><Icons.Minus size={14}/></button>
                                <span className="px-3 text-sm font-bold w-12 text-center">{portions}x</span>
                                <button onClick={() => setPortions(portions+0.5)} className="p-1 hover:bg-gray-100"><Icons.Plus size={14}/></button>
                            </div>
                        </div>
                    </div>
                  )}
                  {timer !== null && (
                      <div className="sticky top-4 z-50 bg-black/80 text-white px-6 py-3 rounded-full shadow-xl flex items-center justify-between mx-auto w-max backdrop-blur">
                          <Icons.Clock className="mr-3 animate-pulse" />
                          <span className="font-mono text-2xl font-bold ml-3 mr-4">{formatTime(timer)}</span>
                          <button onClick={() => setTimer(null)}><Icons.X /></button>
                      </div>
                  )}
                  <div>
                    <div className="flex justify-between items-center mb-4">
                       <h3 className={`font-bold text-xl flex items-center ${theme.text}`}><Icons.Menu size={20} className="mr-2"/> Ingredientes</h3>
                       {!cookingMode && (
                        <button onClick={() => {
                            const itemsToAdd = recipe.ing.filter((_, i) => checked[i]).map(ing => renderIng(ing));
                            if(itemsToAdd.length > 0) onAddToShoppingList(itemsToAdd);
                        }} className="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-full text-gray-600 flex items-center transition font-medium"><Icons.ShoppingBag size={14} className="mr-1"/> Añadir marcados</button>
                       )}
                    </div>
                    <ul className={`grid ${cookingMode ? 'grid-cols-1 text-xl' : 'grid-cols-1 sm:grid-cols-2 text-sm'} gap-3`}>
                      {recipe.ing.map((item, i) => (
                        <li key={i} className={`flex items-start p-2 rounded-lg transition ${checked[i] ? 'bg-green-50 opacity-60' : 'hover:bg-gray-50'} cursor-pointer select-none`} onClick={() => setChecked({...checked, [i]: !checked[i]})}>
                          <div className={`mt-0.5 mr-3 ${checked[i] ? 'text-green-500' : 'text-gray-300'}`}>{checked[i] ? <Icons.CheckSquare size={cookingMode ? 24 : 18}/> : <Icons.Square size={cookingMode ? 24 : 18}/>}</div>
                          <span className={`${checked[i] ? 'line-through opacity-60' : 'text-gray-700'}`}>{renderIng(item)}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                  <div>
                    <h3 className={`font-bold text-xl mb-4 flex items-center ${theme.text}`}><Icons.BookOpen size={20} className="mr-2"/> Preparación</h3>
                    <ol className="space-y-6">
                    {recipe.prep.map((step, i) => (
                        <li key={i} className="flex group">
                        <span className={`flex-shrink-0 ${cookingMode ? 'w-10 h-10 text-lg' : 'w-7 h-7 text-xs'} rounded-full ${theme.bgLight} ${theme.text} font-bold flex items-center justify-center mr-4 mt-0.5 border ${theme.borderLight}`}>{i+1}</span>
                        <span className={`${cookingMode ? 'text-xl leading-relaxed' : 'text-gray-700 leading-relaxed'} cursor-pointer hover:text-blue-600 transition-colors`} onClick={() => startTimer(step)} title="Haz clic si ves un tiempo para iniciar temporizador">{step}</span>
                        </li>
                    ))}
                    </ol>
                  </div>
                  <div className={`p-5 rounded-xl border-l-4 ${theme.bgLight} ${theme.border}`}>
                    <h4 className={`font-bold text-sm mb-2 ${theme.text} flex items-center uppercase tracking-wide`}><Icons.Star size={16} className="mr-2"/> Secreto del Chef</h4>
                    <p className={`${cookingMode ? 'text-lg' : 'text-sm'} text-gray-700 italic`}>"{recipe.secret}"</p>
                  </div>
                </div>
                {!cookingMode && (
                    <div className="p-4 border-t border-gray-100 flex justify-between bg-gray-50 rounded-b-2xl">
                    <button onClick={() => onToggleFavorite(recipe.id)} className={`flex items-center px-4 py-2 rounded-lg text-sm font-medium transition ${isFavorite ? 'text-red-500 bg-red-50 ring-1 ring-red-200' : 'text-gray-600 hover:bg-white hover:shadow-sm'}`}>
                        <Icons.Heart size={16} fill={isFavorite ? "currentColor" : "none"} /> <span className="ml-2">{isFavorite ? 'Guardado' : 'Guardar'}</span>
                    </button>
                    <div className="flex space-x-2">
                        <button className="p-2 text-gray-500 hover:text-gray-800 hover:bg-white hover:shadow-sm rounded-lg transition" onClick={() => window.print()} title="Imprimir"><Icons.Printer size={18}/></button>
                        <button className="p-2 text-gray-500 hover:text-gray-800 hover:bg-white hover:shadow-sm rounded-lg transition" title="Compartir"><Icons.Share2 size={18}/></button>
                    </div>
                    </div>
                )}
              </div>
            </div>
          );
        };

        const App = () => {
            const [module, setModule] = useState('jams');
            const [category, setCategory] = useState('all');
            const [search, setSearch] = useState('');
            const [selected, setSelected] = useState(null);
            const [favorites, setFavorites] = useState([]);
            const [shopList, setShopList] = useState([]);
            const [showList, setShowList] = useState(false);
            const [isMenuOpen, setIsMenuOpen] = useState(false);

            useEffect(() => {
                try {
                    const f = JSON.parse(localStorage.getItem('ryf_favs') || '[]');
                    const l = JSON.parse(localStorage.getItem('ryf_list') || '[]');
                    if(Array.isArray(f)) setFavorites(f);
                    if(Array.isArray(l)) setShopList(l.map(i => typeof i === 'string' ? i : JSON.stringify(i)));
                } catch(e) {}
            }, []);

            const toggleFav = (id, e) => {
                e?.stopPropagation();
                const newFavs = favorites.includes(id) ? favorites.filter(x => x !== id) : [...favorites, id];
                setFavorites(newFavs);
                localStorage.setItem('ryf_favs', JSON.stringify(newFavs));
            };

            const addToList = (items) => {
                const newList = [...shopList, ...items];
                setShopList(newList);
                localStorage.setItem('ryf_list', JSON.stringify(newList));
                alert('Añadido a la lista');
            };

            const removeFromList = (index) => {
                const newList = shopList.filter((_, i) => i !== index);
                setShopList(newList);
                localStorage.setItem('ryf_list', JSON.stringify(newList));
            };

            const mod = MODULES[module];
            const filtered = useMemo(() => FULL_RECIPES.filter(r => {
                if (r.module !== module && category !== 'favorites') return false;
                if (category === 'favorites') return favorites.includes(r.name);
                if (category !== 'all' && r.category !== category) return false;
                if (search && !r.name.toLowerCase().includes(search.toLowerCase())) return false;
                return true;
            }).map(r => ({...r, id: r.name})), [module, category, search, favorites]);

            return (
                <div className="min-h-screen flex flex-col">
                    <nav className="bg-white shadow-sm sticky top-0 z-40">
                        <div className="container mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center">
                                <button className="lg:hidden p-2 -ml-2 text-gray-600 mr-2" onClick={() => setIsMenuOpen(!isMenuOpen)}><Icons.Menu /></button>
                                <h1 className="font-serif font-bold text-xl md:text-2xl text-gray-800">Raíces y Fogones</h1>
                                <span className="mx-3 text-gray-300 hidden md:inline">|</span>
                                <span className="text-xs text-gray-500 font-bold uppercase tracking-widest hidden md:block">Colombia</span>
                            </div>
                            <div className="hidden lg:flex bg-gray-100 p-1 rounded-xl mx-4">
                                {Object.values(MODULES).map(m => (
                                    <button key={m.id} onClick={() => { setModule(m.id); setCategory('all'); }} className={`flex items-center px-4 py-2 rounded-lg text-sm font-bold transition-all ${module === m.id ? 'bg-white shadow-sm ' + m.theme.text : 'text-gray-500 hover:text-gray-700'}`}>
                                        <m.icon size={16} className="mr-2" /> {m.title}
                                    </button>
                                ))}
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setShowList(true)} className="p-2 rounded-full text-gray-600 hover:bg-gray-100 relative">
                                    <Icons.ShoppingBag size={20} />
                                    {shopList.length > 0 && <span className="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white"></span>}
                                </button>
                                <button onClick={() => setCategory(category === 'favorites' ? 'all' : 'favorites')} className={`p-2 rounded-full transition ${category === 'favorites' ? 'bg-red-100 text-red-500' : 'text-gray-600 hover:bg-gray-100'}`}>
                                    <Icons.Heart fill={category === 'favorites' ? "currentColor" : "none"} size={20} />
                                </button>
                            </div>
                        </div>
                        {/* Mobile Tabs */}
                        <div className="md:hidden flex overflow-x-auto p-2 gap-2 border-t border-gray-100">
                             {Object.values(MODULES).map(m => (
                                <button key={m.id} onClick={() => { setModule(m.id); setCategory('all'); }} className={`flex-shrink-0 flex items-center px-3 py-2 rounded-lg text-xs font-bold whitespace-nowrap ${module === m.id ? m.theme.bgLight + ' ' + m.theme.text : 'bg-gray-50 text-gray-500'}`}>
                                    <m.icon size={18} className="mr-3" /> {m.title}
                                </button>
                            ))}
                        </div>
                    </nav>

                    <main className="flex-1 container mx-auto px-4 py-6 flex flex-col lg:flex-row gap-8">
                        <aside className="lg:w-72 flex-shrink-0 space-y-6">
                            <div className={`p-6 rounded-3xl ${mod.theme.bgLight} border ${mod.theme.borderLight} text-center relative overflow-hidden`}>
                                <div className={`absolute top-0 left-0 w-full h-1 ${mod.theme.bgSolid}`}></div>
                                <div className={`mx-auto mb-3 opacity-90 ${mod.theme.text} w-14 h-14 flex items-center justify-center`}><mod.icon size={56}/></div>
                                <h2 className={`font-serif font-bold text-2xl mt-2 mb-1 ${mod.theme.text}`}>{mod.title}</h2>
                                <p className="text-xs text-gray-500 uppercase tracking-widest mb-6 font-semibold">{mod.subtitle}</p>
                                <div className="text-sm text-gray-600 text-left space-y-3">
                                    {mod.guide.map((g, i) => (
                                        <div key={i} className="bg-white/80 p-3 rounded-xl border border-white/50 shadow-sm">
                                            <span className={`font-bold block text-xs mb-1 ${mod.theme.text}`}>{g.title}</span>
                                            <span className="text-xs leading-relaxed opacity-90 whitespace-pre-line">{g.content}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="bg-white rounded-3xl shadow-sm border border-gray-100 p-3 hidden lg:block">
                                <h3 className="text-xs font-bold text-gray-400 uppercase tracking-wider px-3 py-2 mb-1">Recetario</h3>
                                <div className="space-y-1 max-h-[50vh] overflow-y-auto custom-scrollbar pr-1">
                                    {mod.categories.map(cat => (
                                        <button key={cat.id} onClick={() => setCategory(cat.id)} className={`w-full text-left px-4 py-2.5 rounded-xl text-sm transition-all flex justify-between items-center ${category === cat.id ? `${mod.theme.bgSolid} text-white shadow-md` : 'text-gray-600 hover:bg-gray-50'}`}>
                                            <span className="font-medium">{cat.name}</span>
                                            {category === cat.id && <Icons.ArrowRight size={14}/>}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </aside>

                        <div className="flex-1">
                            <div className="mb-6 relative">
                                <div className="absolute left-3 top-3 text-gray-400"><Icons.Search size={18} /></div>
                                <input type="text" placeholder="Buscar receta..." className="w-full pl-10 pr-4 py-3 bg-white border border-gray-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-opacity-50" style={{'--tw-ring-color': mod.theme.text}} value={search} onChange={e => setSearch(e.target.value)}/>
                            </div>
                            
                            <div className="mb-6 flex items-end justify-between border-b border-gray-100 pb-4">
                                <div>
                                    <span className="text-xs font-bold text-gray-400 uppercase tracking-wider">Explorando</span>
                                    <h2 className="text-3xl font-serif font-bold text-gray-800 leading-none mt-1">
                                        {category === 'favorites' ? 'Mis Favoritos' : category === 'all' ? 'Recetario Completo' : mod.categories.find(c => c.id === category)?.name}
                                    </h2>
                                </div>
                                <span className="text-sm font-medium bg-gray-100 px-3 py-1 rounded-full text-gray-600">{filtered.length} recetas</span>
                            </div>

                            {filtered.length > 0 ? (
                                <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
                                    {filtered.map((recipe) => (
                                        <RecipeCard key={recipe.id} recipe={recipe} theme={mod.theme} onClick={setSelected} isFavorite={favorites.includes(recipe.id)} onToggleFavorite={(id, e) => toggleFav(id, e)} />
                                    ))}
                                </div>
                            ) : (
                                <div className="text-center py-24 bg-white rounded-[2rem] border-2 border-dashed border-gray-100">
                                    <div className={`w-20 h-20 mx-auto ${mod.theme.bgLight} rounded-full flex items-center justify-center mb-4 text-gray-400`}>
                                        <Icons.ChefHat size={40} className={mod.theme.text} />
                                    </div>
                                    <p className="text-gray-400 font-medium">No encontramos recetas.</p>
                                    <button onClick={() => {setSearch(''); setCategory('all');}} className={`mt-4 px-6 py-2 rounded-full font-bold text-sm ${mod.theme.bgSolid} text-white`}>Ver todo</button>
                                </div>
                            )}
                        </div>
                    </main>

                    <footer className="bg-white border-t border-gray-200 mt-12 py-8">
                        <div className="container mx-auto px-4 text-center">
                            <div className="flex justify-center items-center mb-4 opacity-50">
                                <Icons.ChefHat className="mr-2" />
                                <span className="font-serif font-bold text-xl">Raíces y Fogones</span>
                            </div>
                            <p className="text-gray-500 text-sm mb-2">
                                Enciclopedia gastronómica digital
                            </p>
                            <div className="w-16 h-1 bg-gray-200 mx-auto my-4 rounded-full"></div>
                            <p className="text-gray-600 text-sm font-medium">
                                Desarrollado por <br/>
                                <span className="text-lg text-gray-800 font-bold">Juan Miguel Rios Redondo</span>
                            </p>
                            <p className="text-gray-400 text-xs mt-4">© {new Date().getFullYear()} Colombia</p>
                        </div>
                    </footer>

                    <RecipeModal recipe={selected} onClose={() => setSelected(null)} isFavorite={selected && favorites.includes(selected.id)} onToggleFavorite={(id) => toggleFav(id)} theme={mod.theme} onAddToShoppingList={addToList} />
                    {showList && <ShoppingListModal list={shopList} onClose={() => setShowList(false)} onRemove={removeFromList} theme={mod.theme} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
